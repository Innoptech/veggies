apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: veggies-demo-opencode
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: veggies
    veggies.io/stack: demo
  name: veggies-demo
spec:
  containers:
  - args:
    - mkdir -p /root/.config/opencode && cp /stack-config/opencode.json /root/.config/opencode/
      && exec opencode serve --hostname 0.0.0.0 --port 4096
    command:
    - sh
    - -c
    env:
    - name: OPENCODE_SERVER_PASSWORD
      valueFrom:
        secretKeyRef:
          key: password
          name: veggies-demo-opencode
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          key: master_key
          name: veggies-demo-litellm
    - name: HTTP_PROXY
      value: http://127.0.0.1:3128
    - name: HTTPS_PROXY
      value: http://127.0.0.1:3128
    - name: http_proxy
      value: http://127.0.0.1:3128
    - name: https_proxy
      value: http://127.0.0.1:3128
    - name: NO_PROXY
      value: 127.0.0.1,localhost
    - name: no_proxy
      value: 127.0.0.1,localhost
    image: localhost/veggies-opencode:1.18.27
    livenessProbe:
      exec:
        command:
        - sh
        - -c
        - nc -z 127.0.0.1 4096 || exit 1
      initialDelaySeconds: 10
      periodSeconds: 30
    name: opencode
    ports:
    - containerPort: 4096
      hostIP: 127.0.0.1
      hostPort: 4096
    resources:
      limits:
        memory: 512Mi
    securityContext: &id001
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /workspace
      name: repo
    - mountPath: /stack-config
      name: stack-config
      readOnly: true
    - mountPath: /root
      name: opencode-home
    - mountPath: /tmp
      name: tmp
    workingDir: /workspace
  - args:
    - --config
    - /agent-config/config.yaml
    - --port
    - '4000'
    - --host
    - 0.0.0.0
    env:
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          key: master_key
          name: veggies-demo-litellm
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          key: salt_key
          name: veggies-demo-litellm
    - name: FIREWORKS_API_KEY
      valueFrom:
        secretKeyRef:
          key: fireworks_api_key
          name: veggies-demo-litellm
    image: ghcr.io/berriai/litellm:v1.99.1
    livenessProbe:
      exec:
        command:
        - sh
        - -c
        - python3 -c "import socket; socket.create_connection(('127.0.0.1', 4000),
          3)" || exit 1
      initialDelaySeconds: 15
      periodSeconds: 30
    name: litellm
    resources:
      limits:
        memory: 768Mi
    securityContext: *id001
    volumeMounts:
    - mountPath: /agent-config
      name: agent-config
      readOnly: true
    - mountPath: /tmp
      name: tmp
  - args:
    - -f
    - /stack-config/squid.conf
    image: localhost/squid:latest
    livenessProbe:
      exec:
        command:
        - bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/3128 || exit 1
      initialDelaySeconds: 5
      periodSeconds: 30
    name: squid
    resources:
      limits:
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        add:
        - SETUID
        - SETGID
        drop:
        - ALL
      readOnlyRootFilesystem: true
    volumeMounts:
    - mountPath: /stack-config
      name: stack-config
      readOnly: true
    - mountPath: /run
      name: run
    - mountPath: /tmp
      name: tmp
  restartPolicy: Always
  volumes:
  - hostPath:
      path: /tmp/veggies-test-state/demo-repo
      type: Directory
    name: repo
  - hostPath:
      path: /tmp/veggies-test-state/demo/config
      type: Directory
    name: stack-config
  - hostPath:
      path: /home/josee/Innoptech/veggie/agent-config/litellm
      type: Directory
    name: agent-config
  - name: opencode-home
    persistentVolumeClaim:
      claimName: veggies-demo-opencode
  - emptyDir: {}
    name: tmp
  - emptyDir: {}
    name: run
