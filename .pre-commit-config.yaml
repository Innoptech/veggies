---
# Run everything: mask precommit   (or: .venv/bin/pre-commit run --all-files)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--config-file, .yamllint]

  - repo: https://github.com/ansible/ansible-lint
    rev: v26.8.0
    hooks:
      - id: ansible-lint
        files: ^ansible/
        # see .ansible-lint exclude_paths: playbooks carry vault vars_files
        exclude: ^ansible/playbooks/

  # gitleaks + actionlint run image-baked (pod/CI) or ~/.local/bin (host,
  # `mask setup`) binaries: language: system -> zero network at hook time
  # (issue #48, ADR 0044; tofu-fmt precedent). Entries are identical to
  # the upstream v8.30.1 / v1.7.12 hooks except `language` (description
  # fields and upstream's minimum_pre_commit_version are dropped) -
  # behavior unchanged.
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false
      - id: actionlint
        name: Lint GitHub Actions workflow files
        entry: actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/

  # tofu fmt uses the local binary (language: system -> no network fetch).
  # CI runs the identical command via the tofu job.
  - repo: local
    hooks:
      - id: tofu-fmt
        name: tofu fmt -check
        entry: bash -c 'exec tofu fmt -check -recursive terraform/'
        language: system
        pass_filenames: false
        files: ^terraform/.*\.tf(vars)?(\.example)?$

  # Safety net: anything under secrets/ that is not an .example MUST be vault-encrypted.
  - repo: local
    hooks:
      - id: vault-encrypted
        name: secrets/*.yml must be ansible-vault encrypted
        entry: scripts/check_vault_encrypted.sh
        language: system
        files: ^secrets/.*\.(yml|yaml)$
        exclude: \.example$
