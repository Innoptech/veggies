---
# Applies infra changes on merge to main. Both jobs are gated by the
# `production-infra` environment (human approval) - the github module creates
# that environment on this repo like on any governed repo.
name: infra-apply

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-apply # never two applies at once; never cancel mid-apply
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.12.6"
  ANSIBLE_CORE_VERSION: "2.21.3"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production-infra
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install the vault toolchain
        run: pip install ansible-core==${{ env.ANSIBLE_CORE_VERSION }} pyyaml

      - name: Write the vault password (runner temp, 0600)
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vault"
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault/password"
          chmod 600 "$RUNNER_TEMP/vault/password"

      - name: Materialize terraform.tfvars from the CI variable
        env:
          INFRA_TFVARS: ${{ vars.INFRA_TFVARS_B64 }}
        run: |
          set -euo pipefail
          # Non-secret repo values, stored base64'd as a repo variable so they
          # stay out of git history (see terraform/terraform.tfvars.example).
          echo "$INFRA_TFVARS" | base64 -d > terraform/terraform.tfvars

      - name: tofu plan + apply (vault-fed env)
        run: |
          set -euo pipefail
          eval "$(python scripts/tfvars_from_vault.py \
            --password-file "$RUNNER_TEMP/vault/password" \
            secrets/github.yml secrets/model.yml secrets/infra.yml)"
          export GITHUB_TOKEN="$TF_VAR_github_token"
          cd terraform
          tofu init -input=false
          tofu apply -input=false -auto-approve

  converge:
    # Converges veggies from a GitHub-hosted runner over the tailnet. Deliberately
    # NOT on veggies's own runner: a runner container cannot reach veggies's sshd
    # (firewalld public zone + our own egress rules block the gateway path).
    runs-on: ubuntu-latest
    needs: apply
    environment: production-infra
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"

      - name: Install ansible
        run: |
          pip install ansible-core==${{ env.ANSIBLE_CORE_VERSION }} pyyaml
          ansible-galaxy collection install -r requirements.yml

      - name: Write the vault password
        env:
          VAULT_PASSWORD: ${{ secrets.VAULT_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/infra
          printf '%s' "$VAULT_PASSWORD" > ~/.config/infra/vault-password
          chmod 600 ~/.config/infra/vault-password

      - name: Materialize group_vars/all.yml from the CI variable
        env:
          GROUP_VARS: ${{ vars.INFRA_GROUP_VARS_B64 }}
        run: |
          set -euo pipefail
          # Same pattern as tfvars: non-secret per-environment values stored
          # base64'd as a repo variable (source: group_vars/all.yml.example).
          echo "$GROUP_VARS" | base64 -d > ansible/inventory/group_vars/all.yml

      - name: Extract tailscale OAuth creds (masked)
        id: tailscale-creds
        run: |
          set -euo pipefail
          for key in tailscale_oauth_client_id tailscale_oauth_secret; do
            value="$(python scripts/vault_get.py secrets/infra.yml "$key")"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Join the tailnet (ephemeral, tagged)
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ steps.tailscale-creds.outputs.tailscale_oauth_client_id }}
          oauth-secret: ${{ steps.tailscale-creds.outputs.tailscale_oauth_secret }}
          tags: tag:ci # TODO(you): ACL tag for CI nodes; should allow ssh to tag:agent-host

      - name: Write the converge ssh key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          python scripts/vault_get.py secrets/infra.yml converge_ssh_private_key > ~/.ssh/converge_key
          chmod 600 ~/.ssh/converge_key

      - name: Converge veggies
        run: |
          set -euo pipefail
          ANSIBLE_SSH_ARGS="-i $HOME/.ssh/converge_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10" \
            ansible-playbook ansible/playbooks/site.yml --limit veggies
