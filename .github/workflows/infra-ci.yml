---
name: infra-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  TOFU_VERSION: "1.12.6"
  TOFU_SHA256: "5dc43da4f750f33873dc25e94587128709e819e544b7be9016b255316153c3a8"
  TFLINT_VERSION: "0.64.0"
  TFLINT_SHA256: "cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537"
  GITLEAK_VERSION: "8.30.1"
  GITLEAK_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  PYTHON_VERSION: "3.14"

# Standing rule: every required branch-protection context (pre-commit, tofu,
# tflint, ansible-lint, molecule, pytest) must REPORT on every run - a
# required check that is job-level `if:`-skipped never reports and wedges
# every merge as Pending forever. Path-gating is therefore step-gating only:
# jobs always run, unchanged areas skip their steps. Whoever later verifies
# GitHub's skipped-conclusion semantics and wants job-level skips writes the
# ADR then.

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # dorny lists PR files via the API
    outputs:
      ansible: ${{ steps.filter.outputs.ansible }}
      terraform: ${{ steps.filter.outputs.terraform }}
      pytest: ${{ steps.filter.outputs.pytest }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # push events diff against the before-SHA
      # agent-trigger.yml, maskfile.md, .pre-commit-config.yaml belong to no
      # filter - the always-on pre-commit job (actionlint/yamllint) covers
      # them and CI never uses mask (AGENTS.md rule 8).
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            ansible:
              - 'ansible/**'
              - 'ansible.cfg'
              - 'requirements.yml'
              - 'requirements-dev.txt'
              - '.ansible-lint'
              - '.github/workflows/infra-ci.yml'
            terraform:
              - 'terraform/**'
              - '.tflint.hcl'
              - '.github/workflows/infra-ci.yml'
            pytest:
              - 'cli/**'
              - 'tests/**'
              - 'scripts/**'
              - 'agent-config/**'
              - 'ansible/**'
              - 'deploy/**'
              - 'terraform/terraform.tfvars.example'
              - 'veggies.yml'
              - '.github/workflows/infra-ci.yml'

  # Single source of truth for: gitleaks, yamllint, actionlint, whitespace/eof,
  # tofu fmt, vault-encryption check, ansible-lint (all via .pre-commit-config.yaml).
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # gitleaks diffs the index against HEAD (see ADR 0047)
      - uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pre-commit==4.6.2
      - name: Dummy vault password file
        # ansible.cfg sets vault_password_file and ansible-core >=2.21
        # hard-fails at startup when it is missing - even for vault-free
        # playbooks. CI has no vault password by design (trust boundary);
        # a dummy satisfies the startup check. Playbooks with real vault
        # vars_files are lint-excluded (see .ansible-lint).
        run: |
          mkdir -p ~/.config/infra
          printf 'ci-dummy-not-a-real-secret\n' > ~/.config/infra/vault-password
      - name: Install gitleaks + actionlint (checksum-pinned, ADR 0047)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAK_VERSION}/gitleaks_${GITLEAK_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAK_SHA256}  gitleaks_${GITLEAK_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar xzf "gitleaks_${GITLEAK_VERSION}_linux_x64.tar.gz" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          curl -sfLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
      - run: pre-commit run --all-files --show-diff-on-failure

  tofu:
    runs-on: ubuntu-latest
    needs: changes
    if: always()
    env:
      RUN_JOB: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip notice
        if: env.RUN_JOB != 'true'
        run: echo "terraform/** unchanged on this PR - tofu validate not applicable to this diff"
      - uses: actions/checkout@v7.0.1
        if: env.RUN_JOB == 'true'
      - uses: opentofu/setup-opentofu@v2.0.2
        if: env.RUN_JOB == 'true'
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
      - if: env.RUN_JOB == 'true'
        run: |
          set -euo pipefail
          cd terraform
          tofu init -backend=false -input=false
          tofu validate

  tflint:
    runs-on: ubuntu-latest
    needs: changes
    if: always()
    env:
      RUN_JOB: ${{ github.event_name != 'pull_request' || needs.changes.outputs.terraform == 'true' }}
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip notice
        if: env.RUN_JOB != 'true'
        run: echo "terraform/** unchanged on this PR - tflint not applicable to this diff"
      - uses: actions/checkout@v7.0.1
        if: env.RUN_JOB == 'true'
      - name: Install tflint (checksum-verified)
        if: env.RUN_JOB == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sfLO "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          curl -sfLO "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/checksums.txt"
          grep "tflint_linux_amd64.zip$" checksums.txt | sha256sum -c -
          unzip -o -j tflint_linux_amd64.zip tflint
          install -m 0755 tflint /usr/local/bin/tflint
      - if: env.RUN_JOB == 'true'
        run: tflint --recursive

  ansible-lint:
    runs-on: ubuntu-latest
    needs: changes
    if: always()
    env:
      RUN_JOB: ${{ github.event_name != 'pull_request' || needs.changes.outputs.ansible == 'true' }}
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip notice
        if: env.RUN_JOB != 'true'
        run: echo "ansible/** unchanged on this PR - ansible-lint not applicable to this diff"
      - uses: actions/checkout@v7.0.1
        if: env.RUN_JOB == 'true'
      - uses: actions/setup-python@v7.0.0
        if: env.RUN_JOB == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - if: env.RUN_JOB == 'true'
        run: pip install ansible-core==2.21.3 ansible-lint==26.8.0
      - name: Dummy vault password file
        if: env.RUN_JOB == 'true'
        # ansible.cfg sets vault_password_file and ansible-core >=2.21
        # hard-fails at startup when it is missing - even for vault-free
        # playbooks. CI has no vault password by design (trust boundary);
        # a dummy satisfies the startup check. Playbooks with real vault
        # vars_files are lint-excluded (see .ansible-lint).
        run: |
          mkdir -p ~/.config/infra
          printf 'ci-dummy-not-a-real-secret\n' > ~/.config/infra/vault-password
      - name: ansible-lint (production profile)
        if: env.RUN_JOB == 'true'
        run: |
          set -euo pipefail
          if [ -d ansible/roles ] && [ -n "$(ls -A ansible/roles)" ]; then
            ansible-lint
          else
            echo "No roles yet (phase 4+); skipping"
          fi

  # Phase C dogfood (ADR 0005): the repo's pytest suite on our ephemeral
  # self-hosted runners. CI never ran it before (mask ci doesn't either -
  # it was local-only). pytest IS a required branch-protection context now
  # (verified live), so it must report on every run; on unrelated PRs the
  # no-op spin-up on the self-hosted runner is accepted - never convert
  # this job to a job-level skip.
  pytest:
    runs-on: [self-hosted, linux, x64, veggies]
    needs: changes
    if: always()
    env:
      RUN_JOB: ${{ github.event_name != 'pull_request' || needs.changes.outputs.pytest == 'true' || needs.changes.outputs.ansible == 'true' }}
    steps:
      - name: Change detection must have succeeded
        if: needs.changes.result != 'success'
        run: exit 1
      - name: Skip notice
        if: env.RUN_JOB != 'true'
        run: echo "pytest-covered paths unchanged on this PR - pytest suite not applicable to this diff"
      - uses: actions/checkout@v7.0.1
        if: env.RUN_JOB == 'true'
      - uses: actions/setup-python@v7.0.0
        if: env.RUN_JOB == 'true'
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # tzdata: python zoneinfo without an OS tz database (runner image has
      # none) would break ZoneInfo() lookups used by the toolbox tests.
      - if: env.RUN_JOB == 'true'
        run: pip install pytest==9.1.1 pyyaml jinja2 ansible-core==2.21.3 tzdata
      - if: env.RUN_JOB == 'true'
        run: python -m pytest tests/ -q

  # Issue #76: build the shared molecule test image once per run; every
  # molecule-roles leg used to run its own podman build (7x per run, again on
  # every strict-mode re-run). The tar rides the run's artifact store - no
  # registry, no cache layering. This job is NOT a required context and must
  # never join required_checks: its job-level if: skip would never report and
  # would wedge merges (the header rule above).
  molecule-image:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # TODO(verify): podman is preinstalled on ubuntu-latest GHA images.
      # If a job ever fails on `podman: command not found`, add:
      #   sudo apt-get update && sudo apt-get install -y podman
      - name: Build the shared test image
        run: podman build -t localhost/fedora44-systemd:latest -f ansible/molecule/fedora44-systemd.Containerfile ansible/molecule
      - name: Export the image
        run: podman save -o "$RUNNER_TEMP/fedora44-systemd.tar" localhost/fedora44-systemd:latest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: fedora44-systemd
          path: ${{ runner.temp }}/fedora44-systemd.tar
          # Strict-mode full-run re-runs rebuild and re-upload under the same
          # name (v4+ artifacts are immutable without overwrite); a single-leg
          # "re-run failed jobs" more than a day later instead 404s here -
          # re-run the whole workflow in that case.
          retention-days: 1
          overwrite: true

  # Branch protection requires a check context named exactly "molecule";
  # the matrix job's check-runs are "molecule (<role>)" and can never
  # satisfy it. The aggregate job below is the required context.
  molecule-roles:
    name: molecule (${{ matrix.role }})
    needs: [changes, molecule-image]
    if: github.event_name != 'pull_request' || needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # keep in sync with ansible/roles/ - drift is guarded by
        # tests/test_infra_ci.py (test_molecule_roles_matrix_matches_role_dirs)
        role: [base, crowdsec, tailscale, podman, github_runner, egress, backup]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements-dev.txt
      - name: Download the shared test image
        uses: actions/download-artifact@v8.0.1
        with:
          name: fedora44-systemd
          path: ${{ runner.temp }}
      - name: Load the shared test image
        run: podman load -i "$RUNNER_TEMP/fedora44-systemd.tar"
      - name: molecule test (${{ matrix.role }})
        working-directory: ansible/roles/${{ matrix.role }}
        run: molecule test

  # The required "molecule" context: it must report on every run, so it is
  # if: always() plus explicit result checks - a path-skipped matrix must
  # never leave branch protection Pending forever. A skipped matrix is
  # legitimate only for ansible-unchanged PRs; anything else fails closed.
  molecule:
    name: molecule
    if: always()
    needs: [changes, molecule-image, molecule-roles]
    runs-on: ubuntu-latest
    env:
      CHANGES_RESULT: ${{ needs.changes.result }}
      MOLECULE_RESULT: ${{ needs.molecule-roles.result }}
      ANSIBLE_CHANGED: ${{ needs.changes.outputs.ansible }}
      IS_PR: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: All molecule scenarios must have passed
        run: |
          echo "changes_result=$CHANGES_RESULT molecule_result=$MOLECULE_RESULT ansible_changed=$ANSIBLE_CHANGED is_pr=$IS_PR"
          [ "$CHANGES_RESULT" = "success" ] || { echo "change detection did not succeed - failing closed"; exit 1; }
          if [ "$MOLECULE_RESULT" = "skipped" ]; then
            if [ "$IS_PR" = "true" ] && [ "$ANSIBLE_CHANGED" = "false" ]; then
              MSG="no ansible/** changes on this PR - molecule scenarios not applicable to this diff"
              echo "$MSG"
              echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "gating bug: molecule-roles skipped outside an ansible-unchanged PR - failing closed"
            exit 1
          fi
          [ "$MOLECULE_RESULT" = "success" ]
