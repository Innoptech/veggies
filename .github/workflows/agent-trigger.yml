---
name: agent-trigger

# ADR 0033: an issue labeled `agent-task`, or a trusted comment containing
# /opencode, kicks this repo's long-lived veggies stack into a fresh
# session that works the issue autonomously: opens a DRAFT PR at its
# first commit and marks it ready only when checks are green and it
# merges cleanly against main (ADR 0046).
# ADR 0038 (amended by 0050): a trusted /distill comment on a
# *discussion* kicks a session that reads the whole thread, distills it
# into issues (plan / happy path / criteria of success), and closes the
# discussion as resolved.
# ADR 0041: a trusted /elaborate comment on a discussion kicks a session
# that posts five persona POV comments (domain expert, infra/architecture,
# marketer, seller, CTO) back on the discussion.
# ADR 0054 (issue #102): a PR flipping ready_for_review, or a trusted
# /review PR comment, kicks one comment-only review session - a different
# model audits the final diff against the issue's acceptance criteria and
# the posted plan, then posts a risk-ranked `gh pr review --comment`
# brief. Comment-only, never an approval; the merge gate stays human
# (ADR 0007).
#
# Outbound-only on our side: the self-hosted runner polls GitHub, then
# calls the stack's opencode API on the VPS host gateway
# (host.containers.internal bypasses the proxy via NO_PROXY in the runner
# quadlet). No inbound listener exists on the VPS.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  discussion_comment:
    types: [created]
  pull_request_target:
    # ready_for_review ONLY (ADR 0054): draft-first pushes early and often
    # (ADR 0046), so `synchronize` would burn review sessions on
    # known-unfinished work and flood the 0051 spend log. The _target form
    # is the security boundary: the workflow definition and the checkout
    # below come from the trusted default branch, never from the PR head.
    types: [ready_for_review]

# The PR review itself is posted by the kicked session (pod bot PAT, ADR
# 0030), never by this workflow - the job token needs no write on PRs.
permissions:
  issues: write # comment the kicked session back onto the issue (ADR 0034)
  pull-requests: read # the done-guard looks up existing agent/issue-N PRs (ADR 0035/0046)
  discussions: write # read the thread for the prompt; comment the session link back (ADR 0038)

jobs:
  kick:
    # Trigger gates (ADR 0040, amended by 0043/0054): /opencode (issues),
    # /distill and /elaborate (discussions), and /review (PRs) are
    # COMMANDS - they must start the comment; a prose mention never fires.
    # ready_for_review auto-kicks only for same-repo agent/issue-* heads:
    # the fork check keeps secrets away from fork PRs, the prefix keeps
    # human PRs on the manual /review path. INTERIM (ADR 0043): while the
    # agent shares the operator's olgam4 identity there is NO login
    # exclusion - olgam4 may trigger. The self-kick loop is bounded by
    # command anchoring, the in-flight guard (all modes, stack_kick.py),
    # the issue done-guard, and the four-verb hygiene line every kick
    # prompt carries (`gh pr review` fires pull_request_review, which this
    # workflow never subscribes to - the reviewer's own review cannot
    # re-kick). The hard bot exclusion returns with the GitHub App
    # identity.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent-task') ||
      (github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/opencode') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'discussion_comment' &&
        (startsWith(github.event.comment.body, '/distill') ||
         startsWith(github.event.comment.body, '/elaborate')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_target' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'agent/issue-'))
    runs-on: [self-hosted, linux, x64, veggies]
    env:
      # addComment takes issue/PR subjects only; discussions need
      # addDiscussionComment (verified 2026-09-11, run 34602194185: the
      # session-link step got 200 + errors[] and failed the job - ADR 0039).
      ADD_COMMENT: 'mutation($subjectId: ID!, $body: String!) { addComment(input: {subjectId: $subjectId, body: $body}) { clientMutationId } }'
      ADD_DISCUSSION_COMMENT: >-
        mutation($discussionId: ID!, $body: String!)
        { addDiscussionComment(input: {discussionId: $discussionId, body: $body}) { clientMutationId } }
    concurrency:
      # one kick per subject at a time; a re-label/re-comment queues behind,
      # not parallel. Prefixed by event: issue and discussion numbers are
      # independent sequences and would otherwise collide.
      group: agent-kick-${{ github.event_name }}-${{ github.event.issue.number || github.event.discussion.number || github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # pull_request_target already checks out the default branch; pin
          # it for every event so scripts/stack_kick.py and the no-ask
          # scan always run trusted default-branch code, never PR-head
          # content (ADR 0054).
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Kick the veggies stack
        id: kick
        env:
          STACK_URL: http://${{ vars.VEGGIES_STACK_HOST }}:${{ vars.VEGGIES_STACK_PORT }}
          STACK_PASSWORD: ${{ secrets.VEGGIES_STACK_PASSWORD }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          # PR-review mode (ADR 0054): the pull_request slot carries
          # ready_for_review; the issue slot carries a /review comment's PR
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
          PR_TITLE: ${{ github.event.pull_request.title || (github.event.issue.pull_request && github.event.issue.title) }}
          PR_BODY: ${{ github.event.pull_request.body || (github.event.issue.pull_request && github.event.issue.body) }}
          PR_URL: ${{ github.event.pull_request.html_url || (github.event.issue.pull_request && github.event.issue.html_url) }}
          # discussion mode when set (ADR 0038); empty on issue events
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          DISCUSSION_URL: ${{ github.event.discussion.html_url }}
          # distill (default) or elaborate; /elaborate wins when both verbs
          # open the comment (ADR 0041)
          DISCUSSION_COMMAND: ${{ startsWith(github.event.comment.body, '/elaborate') && 'elaborate' || 'distill' }}
          REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # done-guard (issues) / thread fetch (discussions)
        run: |
          set +e
          python3 scripts/stack_kick.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # exit 3 = kick skipped (done-guard ADR 0035 / in-flight
          # ADR 0040/0043 / no-ask gate ADR 0049): a clean outcome,
          # not a job failure - the skip comment step handles it.
          [ "$rc" -eq 3 ] && exit 0
          exit "$rc"

      # The issue is where people look - tell it which session is working it
      # and how to watch (ADR 0034). GITHUB_TOKEN comments; the bot PAT is
      # not involved. The password is never posted, only how to read it. The
      # session comment is the user-facing value, so it runs BEFORE the
      # best-effort label housekeeping below (verified 2026-09-11: a failed
      # DELETE swallowed the success comment). Issues only: a discussion kick
      # gets the minimal ack below instead - the session link lives on the
      # issues the agent creates (ADR 0039).
      - name: Comment the session link on the subject
        if: >-
          success() && steps.kick.outputs.rc == '0' &&
          github.event_name != 'discussion_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_ID: ${{ github.event.issue.node_id || github.event.discussion.node_id || github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
          # env-routed, never spliced into the shell string: the gate is
          # repo-controlled text and could carry $()/backticks
          VERIFY_GATE: ${{ steps.kick.outputs.verify_gate }}
        run: |
          set -euo pipefail
          sid="${{ steps.kick.outputs.session_id }}"
          port="${{ vars.VEGGIES_STACK_PORT }}"
          ui_port=$((1000 + port))
          # The web UI scopes by directory; the route carries it as
          # base64url(/workspace), no padding (ADR 0034).
          dirseg=$(printf '/workspace' | base64 | tr '+/' '-_' | tr -d '=')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue_n="${{ github.event.issue.number }}"
          if [ -n "$PR_NUMBER" ]; then
            body="**veggies PR reviewer kicked** - session \`${sid}\` is auditing this PR on stack \`veggie\` (ADR 0054):"
            body="$body"$' a different model than the author\'s reviews the final diff against the linked'
            body="$body"$' issue\'s acceptance criteria and the posted plan, then posts ONE comment-only'
            body="$body"$' review brief - risk rank first, threat-model hunks flagged. The review never'
            body="$body"$' approves; the merge decision stays with the human code owner (ADR 0007).'
            body="$body"$' [Workflow log]('"${run_url})."
            body="$body"$'\n\n'"Watch it live:"
            body="$body"$'\n'"1. \`veggies ui veggie\` (or \`ssh -N -L ${ui_port}:127.0.0.1:${port} veggies\`)"
            body="$body"$'\n'"2. open <http://127.0.0.1:${ui_port}/${dirseg}/session/${sid}>"
            body="$body"$'\n'"3. password: \`jq -r '.stacks.veggie.password' ~/.local/state/veggies/state.json\`"
          else
            body="**veggies agent kicked** - session \`${sid}\` is working this issue on stack \`veggie\`."
            tail="The agent branches \`agent/issue-${issue_n}\` and opens (or continues) a DRAFT PR early -"
            tail="$tail commits and CI land there as it works. It marks the PR ready only"
            tail="$tail when checks are green and it merges cleanly against main (ADR 0046)."
            tail="$tail [Workflow log](${run_url})."
            body="$body"$'\n\n'"Watch it live:"
            body="$body"$'\n'"1. \`veggies ui veggie\` (or \`ssh -N -L ${ui_port}:127.0.0.1:${port} veggies\`)"
            body="$body"$'\n'"2. open <http://127.0.0.1:${ui_port}/${dirseg}/session/${sid}>"
            body="$body"$'\n'"3. password: \`jq -r '.stacks.veggie.password' ~/.local/state/veggies/state.json\`"
            body="$body"$'\n\n'"$tail"
            body="$body"$'\n'"Verify gate: \`$VERIFY_GATE\`"
          fi
          jq -n --arg body "$body" --arg q "$ADD_COMMENT" \
            '{query: $q, variables: {subjectId: env.SUBJECT_ID, body: $body}}' > /tmp/comment.json
          resp=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json https://api.github.com/graphql)
          echo "$resp"
          echo "$resp" | jq -e 'has("errors") | not' > /dev/null

      # Discussion kicks get a minimal ack only (ADR 0039): no session link,
      # no watch instructions - the real feedback is the agent's closing
      # comment listing the issues it created.
      - name: Ack the kick on the discussion
        if: >-
          success() && steps.kick.outputs.rc == '0' &&
          github.event_name == 'discussion_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_ID: ${{ github.event.discussion.node_id }}
          # same verb detection as the kick step (ADR 0041)
          DISCUSSION_COMMAND: ${{ startsWith(github.event.comment.body, '/elaborate') && 'elaborate' || 'distill' }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$DISCUSSION_COMMAND" = "elaborate" ]; then
            body="**veggies agent kicked** - elaborating this discussion: five persona"
            body="$body"$' POV comments (domain expert, infra/architecture, marketer,'
            body="$body"$' seller, CTO) land below, one per role. [Workflow log]('"${run_url})."
          else
            body="**veggies agent kicked** - distilling this discussion into issues;"
            body="$body"$' each created issue links back here, and the agent comments'
            body="$body"$' the issue links below when done; if the thread yielded'
            body="$body"$' issues it then closes this discussion as resolved.'
            body="$body"$' [Workflow log]('"${run_url})."
          fi
          jq -n --arg body "$body" --arg q "$ADD_DISCUSSION_COMMENT" \
            '{query: $q, variables: {discussionId: env.SUBJECT_ID, body: $body}}' > /tmp/comment.json
          resp=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json https://api.github.com/graphql)
          echo "$resp"
          echo "$resp" | jq -e 'has("errors") | not' > /dev/null

      # Label clearing is best-effort housekeeping and must never eat the
      # session comment (verified 2026-09-11: a failed DELETE swallowed the
      # success comment even though the label WAS removed - so:
      # continue-on-error + loud status print, and the comment runs first).
      # Issues only - discussions carry no agent-task label (ADR 0038).
      - name: Clear the agent-task label
        # One-shot trigger semantics (ADR 0035): a kicked or skipped issue
        # is handled; re-adding the label is the deliberate retrigger.
        # On kick failure the label stays, so the intent survives.
        if: >-
          always() && github.event_name == 'issues' &&
          (steps.kick.outputs.rc == '0' || steps.kick.outputs.rc == '3')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos"
          api="$api/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels/agent-task"
          curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o /dev/null -w "unlabel http %{http_code}\n" "$api"


      # rc 3: issue-mode done-guard (ADR 0035), either mode's in-flight
      # guard (ADR 0043), or the no-ask gate (ADR 0049). Skip feedback
      # lands on the actual subject:
      # discussions take addDiscussionComment, issues addComment (ADR 0039).
      - name: Comment when the kick is skipped
        if: success() && steps.kick.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_ID: ${{ github.event.issue.node_id || github.event.discussion.node_id || github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
          SKIP_REASON: ${{ steps.kick.outputs.skip_reason }}
        run: |
          set -euo pipefail
          body="**veggies kick skipped** - ${SKIP_REASON}."
          if [ "${{ github.event_name }}" = "discussion_comment" ]; then
            body="$body"$' Comment /distill (or /elaborate) again if it truly needs another pass.'
            jq -n --arg body "$body" --arg q "$ADD_DISCUSSION_COMMENT" --arg id "$SUBJECT_ID" \
              '{query: $q, variables: {discussionId: $id, body: $body}}' > /tmp/comment.json
          elif [ -n "$PR_NUMBER" ]; then
            body="$body"$' Comment /review again if it truly needs another review.'
            jq -n --arg body "$body" --arg q "$ADD_COMMENT" --arg id "$SUBJECT_ID" \
              '{query: $q, variables: {subjectId: $id, body: $body}}' > /tmp/comment.json
          else
            body="$body"$' Re-add the agent-task label (or comment /opencode) if it truly needs another pass.'
            jq -n --arg body "$body" --arg q "$ADD_COMMENT" --arg id "$SUBJECT_ID" \
              '{query: $q, variables: {subjectId: $id, body: $body}}' > /tmp/comment.json
          fi
          resp=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json https://api.github.com/graphql)
          echo "$resp"
          echo "$resp" | jq -e 'has("errors") | not' > /dev/null

      - name: Comment when the kick fails
        if: always() && steps.kick.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUBJECT_ID: ${{ github.event.issue.node_id || github.event.discussion.node_id || github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number || (github.event.issue.pull_request && github.event.issue.number) }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          kind="issue"; [ -n "$PR_NUMBER" ] && kind="PR"; [ "${{ github.event_name }}" = "discussion_comment" ] && kind="discussion"
          body="**veggies kick failed** - the stack accepted no session for this ${kind}."
          body="$body"$' Check \`veggies status veggie\` and that the Actions variable'
          body="$body"$' \`VEGGIES_STACK_PORT\` matches \`veggies ls\`.'
          body="$body"$' [Workflow log]('"${run_url})."
          # failure feedback must land on the actual subject: discussions
          # take addDiscussionComment, issues take addComment (ADR 0039).
          if [ "${{ github.event_name }}" = "discussion_comment" ]; then
            jq -n --arg body "$body" --arg q "$ADD_DISCUSSION_COMMENT" --arg id "$SUBJECT_ID" \
              '{query: $q, variables: {discussionId: $id, body: $body}}' > /tmp/comment.json
          else
            jq -n --arg body "$body" --arg q "$ADD_COMMENT" --arg id "$SUBJECT_ID" \
              '{query: $q, variables: {subjectId: $id, body: $body}}' > /tmp/comment.json
          fi
          resp=$(curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json https://api.github.com/graphql)
          echo "$resp"
          echo "$resp" | jq -e 'has("errors") | not' > /dev/null
