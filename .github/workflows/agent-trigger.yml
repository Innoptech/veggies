---
name: agent-trigger

# ADR 0033: an issue labeled `agent-task`, or a trusted comment containing
# /opencode, kicks this repo's long-lived veggies stack into a fresh
# session that works the issue autonomously and opens a PR.
#
# Outbound-only on our side: the self-hosted runner polls GitHub, then
# calls the stack's opencode API on the VPS host gateway
# (host.containers.internal bypasses the proxy via NO_PROXY in the runner
# quadlet). No inbound listener exists on the VPS.

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  issues: write # comment the kicked session back onto the issue (ADR 0034)
  pull-requests: read # the done-guard looks up existing agent/issue-N PRs (ADR 0035)

jobs:
  kick:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent-task') ||
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '/opencode') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: [self-hosted, linux, x64, veggies]
    concurrency:
      # one kick per issue at a time; a re-label queues behind, not parallel
      group: agent-kick-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - name: Kick the veggies stack
        id: kick
        env:
          STACK_URL: http://${{ vars.VEGGIES_STACK_HOST }}:${{ vars.VEGGIES_STACK_PORT }}
          STACK_PASSWORD: ${{ secrets.VEGGIES_STACK_PASSWORD }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          REPO: ${{ github.repository }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # the done-guard's API auth
        run: |
          set +e
          python3 scripts/stack_kick.py
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # exit 3 = issue already handled (ADR 0035): a clean outcome,
          # not a job failure - the skip comment step handles it.
          [ "$rc" -eq 3 ] && exit 0
          exit "$rc"

      - name: Clear the agent-task label
        # One-shot trigger semantics (ADR 0035): a kicked or skipped issue
        # is handled; re-adding the label is the deliberate retrigger.
        # On failure the label stays, so the intent survives.
        if: >-
          success() && (steps.kick.outputs.rc == '0' || steps.kick.outputs.rc == '3')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos"
          api="$api/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels/agent-task"
          curl -sf -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$api" > /dev/null

      # The issue is where people look - tell it which session is working it
      # and how to watch (ADR 0034). GITHUB_TOKEN comments; the bot PAT is
      # not involved. The password is never posted, only how to read it.
      - name: Comment the session link on the issue
        if: success() && steps.kick.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sid="${{ steps.kick.outputs.session_id }}"
          port="${{ vars.VEGGIES_STACK_PORT }}"
          ui_port=$((1000 + port))
          # The web UI scopes by directory; the route carries it as
          # base64url(/workspace), no padding (ADR 0034).
          dirseg=$(printf '/workspace' | base64 | tr '+/' '-_' | tr -d '=')
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue_n="${{ github.event.issue.number }}"
          body="**veggies agent kicked** - session \`${sid}\` is working this issue on stack \`veggie\`."
          body="$body"$'\n\n'"Watch it live:"
          body="$body"$'\n'"1. \`veggies ui veggie\` (or \`ssh -N -L ${ui_port}:127.0.0.1:${port} veggies\`)"
          body="$body"$'\n'"2. open <http://127.0.0.1:${ui_port}/${dirseg}/session/${sid}>"
          body="$body"$'\n'"3. password: \`jq -r '.stacks.veggie.password' ~/.local/state/veggies/state.json\`"
          body="$body"$'\n\n'"The agent branches \`agent/issue-${issue_n}\`, runs the checks, and opens a PR"
          body="$body"$' that closes this issue. '"[Workflow log](${run_url})."
          jq -n --arg body "$body" '{body: $body}' > /tmp/comment.json
          api="https://api.github.com/repos"
          api="$api/${{ github.repository }}/issues/${issue_n}/comments"
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json "$api" > /dev/null

      - name: Comment when the issue is already handled
        if: success() && steps.kick.outputs.rc == '3'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body="**veggies kick skipped** - already handled: ${{ steps.kick.outputs.skip_reason }}."
          body="$body"$' Re-add the agent-task label (or comment /opencode) if it truly needs another pass.'
          jq -n --arg body "$body" '{body: $body}' > /tmp/comment.json
          api="https://api.github.com/repos"
          api="$api/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json "$api" > /dev/null

      - name: Comment when the kick fails
        if: always() && steps.kick.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body="**veggies kick failed** - the stack accepted no session for this issue."
          body="$body"$' Check \`veggies status veggie\` and that the Actions variable'
          body="$body"$' \`VEGGIES_STACK_PORT\` matches \`veggies ls\`.'
          body="$body"$' [Workflow log]('"${run_url})."
          jq -n --arg body "$body" '{body: $body}' > /tmp/comment.json
          api="https://api.github.com/repos"
          api="$api/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments"
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data @/tmp/comment.json "$api" > /dev/null
