---
# Steady-state converge. Role order matters: network access (tailscale) before
# anything that pulls; proxy (egress) before agents that must be constrained.
# base_public_ssh stays false here - site.yml never re-opens public SSH.
- name: Converge veggies
  hosts: veggies
  become: true
  vars_files:
    - ../secrets/infra.yml
    - ../secrets/github.yml
    - ../secrets/model.yml
  roles:
    # Substrate only (ADR 0016): these roles prepare a box so `veggies`
    # stacks can run on it. No role may install/configure/observe a stack
    # container - that is the CLI's job (ADR 0013/0014).
    - role: base
    - role: crowdsec
    - role: tailscale
    - role: podman
    - role: egress # before anything that must build/pull as a restricted user
    - role: github_runner
    - role: backup
