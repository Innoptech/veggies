---
# One-time bootstrap of a fresh VPS over its public IP (ADR 0008 variant of
# ADR 0003: there is no security group on a VPS - the close-out is firewalld).
#
#   mask bootstrap
#
# The verification play sits between hardening and the close-out ON PURPOSE:
# public SSH is only removed after tailnet SSH is proven. The verify tasks are
# deliberately untagged so `--tags` cannot skip them.
- name: Bootstrap veggies over the public IP
  hosts: veggies
  become: true
  vars:
    base_public_ssh: true # the bootstrap window, closed by the last play
  vars_files:
    - ../secrets/infra.yml
  roles:
    - role: base
    - role: crowdsec
    - role: tailscale

- name: Verify tailnet reachability (gate - do not tag, do not skip)
  hosts: veggies
  become: true
  gather_facts: false
  tasks:
    - name: Read tailscale status
      ansible.builtin.command:
        cmd: /usr/bin/tailscale status --json
      register: bootstrap_ts_status
      changed_when: false

    - name: Fail loudly unless the node is Running in the tailnet
      ansible.builtin.assert:
        that:
          - (bootstrap_ts_status.stdout | from_json).BackendState == "Running"
          - (bootstrap_ts_status.stdout | from_json).Self.Online
        fail_msg: "tailscale is not Running/Online - refusing to close public SSH. Fix this first."

    - name: Record the tailnet IPv4
      ansible.builtin.set_fact:
        veggies_ts_ip: >-
          {{ (bootstrap_ts_status.stdout | from_json).Self.TailscaleIPs
             | select('match', '^100\.') | first }}

    - name: Prove SSH over the tailnet from the operator machine
      ansible.builtin.command:
        cmd: >-
          ssh -o BatchMode=yes -o ConnectTimeout=10
          -o StrictHostKeyChecking=accept-new {{ admin_user }}@{{ veggies_ts_ip }} true
      delegate_to: localhost
      changed_when: false
      failed_when: bootstrap_ts_ssh.rc != 0
      register: bootstrap_ts_ssh
      # If this fails the play stops here and public SSH stays open.

- name: Close public SSH
  hosts: veggies
  become: true
  tasks:
    - name: Remove ssh from the public zone
      ansible.posix.firewalld:
        service: ssh
        state: disabled
        permanent: true
        immediate: true
        zone: public

    - name: Mark bootstrap complete
      ansible.builtin.copy:
        dest: /etc/infra-bootstrap-done
        content: "bootstrap completed; public ssh closed\n"
        mode: "0644"

    - name: Next step for the operator
      ansible.builtin.debug:
        msg: "Public SSH is closed. Update ~/.ssh/config 'Host veggies' to the tailnet name, then run: mask converge"
