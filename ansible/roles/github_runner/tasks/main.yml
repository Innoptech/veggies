---
- name: Resolve the runner user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ github_runner_user }}"

- name: Record the uid
  ansible.builtin.set_fact:
    github_runner_uid: "{{ ansible_facts.getent_passwd[github_runner_user][2] }}"

- name: Compute runner instance names
  ansible.builtin.set_fact:
    # Jinja has no list comprehensions - use filters.
    # scope=repo: one set of runners per repo ("<repo>-<n>");
    # scope=org:  a single org-wide set ("<n>").
    github_runner_instances: >-
      {{ (github_repos | product(range(1, github_runner_count + 1) | list) | map('join', '-') | list)
         if github_runner_scope == 'repo'
         else (range(1, github_runner_count + 1) | list | map('string') | list) }}

- name: Ensure the runner user's systemd manager is running
  ansible.builtin.systemd:
    name: "user@{{ github_runner_uid }}"
    state: started

- name: Ensure the runner user's podman socket listens (docker-compatible job steps)
  ansible.builtin.systemd:
    name: podman.socket
    enabled: true
    state: started
    scope: user
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    HOME: "/home/{{ github_runner_user }}"
    XDG_RUNTIME_DIR: "/run/user/{{ github_runner_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ github_runner_uid }}/bus"

- name: Ensure the runner work root exists
  ansible.builtin.file:
    path: "{{ github_runner_work_root }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"

- name: Ensure the per-instance work dirs exist
  ansible.builtin.file:
    path: "{{ github_runner_work_root }}/{{ item }}"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"
  loop: "{{ github_runner_instances }}"
  loop_control:
    label: "{{ item }}"

- name: Ensure the user bin directory exists
  ansible.builtin.file:
    path: "/home/{{ github_runner_user }}/.local/bin"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"

- name: Install the token fetcher
  ansible.builtin.copy:
    src: fetch_runner_token.py
    dest: "/home/{{ github_runner_user }}/.local/bin/fetch_runner_token"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"

- name: Ensure the env directory exists
  ansible.builtin.file:
    path: "/home/{{ github_runner_user }}/.config/gh-runner"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0700"

- name: Ensure the optional runtime-env drop-in exists (quadlet references it)
  ansible.builtin.copy:
    content: "# Optional extra env for gh-runner services (edit by hand; unmanaged)\n"
    dest: "/home/{{ github_runner_user }}/.config/gh-runner/runtime.env"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0600"
    force: false # never clobber an operator's hand edits

- name: Install the API env file (from the vault)
  ansible.builtin.template:
    src: api.env.j2
    dest: "/home/{{ github_runner_user }}/.config/gh-runner/api.env"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0600"
  no_log: true # contains the admin token
  when: github_runner_register

- name: Install the quadlet template
  ansible.builtin.template:
    src: gh-runner@.container.j2
    dest: "/home/{{ github_runner_user }}/.config/containers/systemd/gh-runner@.container"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0640"
  register: github_runner_quadlet
  notify: Daemon-reload the gh-runner user manager

- name: List existing runner unit links
  ansible.builtin.find:
    paths: "/home/{{ github_runner_user }}/.config/containers/systemd"
    patterns: "gh-runner@*.container"
    file_type: link
  register: github_runner_existing_links

- name: Instantiate runner units (symlinks next to the template)
  ansible.builtin.file:
    src: "/home/{{ github_runner_user }}/.config/containers/systemd/gh-runner@.container"
    dest: "/home/{{ github_runner_user }}/.config/containers/systemd/gh-runner@{{ item }}.container"
    state: link
    follow: false
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
  loop: "{{ github_runner_instances }}"
  loop_control:
    label: "{{ item }}"
  notify: Daemon-reload the gh-runner user manager

- name: Remove units for instances that no longer exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  # No regex on purpose: derive the instance name with plain string ops.
  when: >-
    ((item.path | basename) | replace('gh-runner@', '') | replace('.container', ''))
    not in github_runner_instances
  loop: "{{ github_runner_existing_links.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  notify: Daemon-reload the gh-runner user manager

- name: Create the runner build context directory
  ansible.builtin.file:
    path: "/home/{{ github_runner_user }}/runner-build"
    state: directory
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0750"
  when: github_runner_build_image

- name: Stage the runner build context on the host
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/home/{{ github_runner_user }}/runner-build/{{ item }}"
    owner: "{{ github_runner_user }}"
    group: "{{ github_runner_user }}"
    mode: "0644"
  loop:
    - runner.Containerfile
    - runner-entrypoint.sh
  when: github_runner_build_image
  register: github_runner_context

- name: Build the runner image as the service user
  containers.podman.podman_image:
    name: localhost/gh-runner
    tag: "{{ github_runner_version }}"
    # The module does NOT detect context/arg changes on its own (verified
    # 2026-09-09: an entrypoint fix never rebuilt). Force iff the staged
    # context changed - idempotent and never stale.
    force: "{{ github_runner_context is changed }}"
    path: "/home/{{ github_runner_user }}/runner-build" # remote context (builds run on the VPS)
    build:
      file: "/home/{{ github_runner_user }}/runner-build/runner.Containerfile"
      # no args: in the new API (the module does not rebuild on extra_args
      # changes - fine: the version pin changes name:tag anyway)
      extra_args: >-
        --network=host
        --build-arg RUNNER_VERSION={{ github_runner_version }}
        --build-arg RUNNER_SHA256={{ github_runner_sha256 }}
        --build-arg HTTPS_PROXY={{ github_runner_build_proxy }}
        --build-arg HTTP_PROXY={{ github_runner_build_proxy }}
    state: build
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ github_runner_uid }}"
    # Pulls of the base image also go through the proxy (host-side, as
    # gh-runner, direct egress is denied by the egress role).
    HTTPS_PROXY: "{{ github_runner_build_proxy }}"
    HTTP_PROXY: "{{ github_runner_build_proxy }}"
  when: github_runner_build_image

- name: Apply pending quadlet daemon-reloads before starting
  ansible.builtin.meta: flush_handlers

# Same lost-handler guard as the egress role: a quadlet installed in an
# earlier failed run has no pending notification - reload if unknown.
- name: Check whether the user manager knows the runner template yet
  ansible.builtin.command:  # noqa command-instead-of-module - no module queries user-scope units
    cmd: /usr/bin/systemctl --user cat gh-runner@.service
  register: github_runner_unit
  changed_when: false
  failed_when: false
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ github_runner_uid }}"
  when:
    - github_runner_start
    - github_runner_register

- name: Daemon-reload the user manager when the unit is unknown
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ github_runner_uid }}"
  when:
    - github_runner_start
    - github_runner_register
    - github_runner_unit.rc != 0

- name: Start runner units
  ansible.builtin.systemd:
    name: "gh-runner@{{ item }}.service"
    scope: user
    state: started
  become: true
  become_user: "{{ github_runner_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ github_runner_uid }}"
  loop: "{{ github_runner_instances }}"
  loop_control:
    label: "{{ item }}"
  when:
    - github_runner_start
    - github_runner_register
