---
- name: Converge
  hosts: instance
  become: true
  vars:
    admin_user: fedora
    podman_users: [gh-runner, egress-proxy] # podman role owns the quadlet dirs
    egress_model_endpoints: [api.fireworks.ai]
    egress_allowlist_extra: []
    egress_build_image: false # no image build in tests
    egress_start_proxy: false # squid runs on real hosts; nft rules are tested here
  pre_tasks:
    - name: Create the users the base role would provide
      ansible.builtin.user:
        name: "{{ item.name }}"
        shell: "{{ item.shell }}"
        home: "/home/{{ item.name }}"
        create_home: true
      loop:
        - { name: gh-runner, shell: /usr/sbin/nologin }
        - { name: egress-proxy, shell: /usr/sbin/nologin }
        - { name: stacks, shell: /usr/sbin/nologin }

    - name: Check the linger markers
      ansible.builtin.stat:
        path: "/var/lib/systemd/linger/{{ item }}"
      register: egress_molecule_linger
      loop: [gh-runner, egress-proxy, stacks]

    - name: Enable linger where missing
      ansible.builtin.command:
        cmd: /usr/bin/loginctl enable-linger {{ item.item }}
      when: not item.stat.exists
      changed_when: true
      loop: "{{ egress_molecule_linger.results }}"
  roles:
    - role: podman
    - role: egress
