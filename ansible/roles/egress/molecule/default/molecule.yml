---
# Collections come from the shared ansible/requirements.yml via the
# collections.yml symlink in this directory (molecule's default filename).
dependency:
  name: galaxy
driver:
  name: podman
platforms:
  - name: instance
    image: localhost/fedora44-systemd:latest
    pre_build_image: true # built by `mask molecule-images`
    command: /usr/sbin/init
    privileged: true
provisioner:
  name: ansible
  config_options:
    defaults:
      # Molecule 26 does not inject the role's parent dir anymore.
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/..
verifier:
  name: ansible
