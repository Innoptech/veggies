---
- name: Resolve the proxy user's uid
  ansible.builtin.getent:
    database: passwd
    key: "{{ litellm_user }}"

- name: Ensure the proxy user's systemd manager is running
  ansible.builtin.systemd:
    name: "user@{{ ansible_facts.getent_passwd[litellm_user][2] }}"
    state: started

- name: Ensure the litellm config directory exists
  ansible.builtin.file:
    path: "/home/{{ litellm_user }}/.config/litellm"
    state: directory
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0700"

- name: Install the model routing config (from the vendored agent-config tree)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../agent-config/litellm/config.yaml"
    dest: "/home/{{ litellm_user }}/.config/litellm/config.yaml"
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0600"
  when: litellm_sync_config | default(true)

- name: Install the env file (provider key + master key, from the vault)
  ansible.builtin.template:
    src: litellm.env.j2
    dest: "/home/{{ litellm_user }}/.config/litellm/litellm.env"
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0600"
  no_log: true
  when: litellm_install_env | default(true)

- name: Install the quadlet
  ansible.builtin.template:
    src: litellm.container.j2
    dest: "/home/{{ litellm_user }}/.config/containers/systemd/litellm.container"
    owner: "{{ litellm_user }}"
    group: "{{ litellm_user }}"
    mode: "0640"
  register: litellm_quadlet
  notify: Daemon-reload the litellm user manager

- name: Pull the litellm image
  containers.podman.podman_image:
    name: "{{ litellm_image }}"
    state: present
  become: true
  become_user: "{{ litellm_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[litellm_user][2] }}"
  when: litellm_pull_image

- name: Start litellm
  ansible.builtin.systemd:
    name: litellm.service
    scope: user
    state: started
  become: true
  become_user: "{{ litellm_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd[litellm_user][2] }}"
  when: litellm_start
