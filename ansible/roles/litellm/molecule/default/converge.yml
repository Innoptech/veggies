---
- name: Converge
  hosts: instance
  become: true
  vars:
    admin_user: fedora
    litellm_pull_image: false
    litellm_start: false
    litellm_sync_config: false # playbook-relative agent-config path is a site.yml thing
    litellm_install_env: false # no vault values in tests
    podman_users: [egress-proxy] # the podman role owns the quadlet dir
  pre_tasks:
    - name: Create the proxy user the base role would provide
      ansible.builtin.user:
        name: egress-proxy
        shell: /usr/sbin/nologin
        home: /home/egress-proxy
        create_home: true

    - name: Check the linger marker
      ansible.builtin.stat:
        path: /var/lib/systemd/linger/egress-proxy
      register: litellm_molecule_linger

    - name: Enable linger (the base role does this; keeps the user manager up)
      ansible.builtin.command:
        cmd: /usr/bin/loginctl enable-linger egress-proxy
      when: not litellm_molecule_linger.stat.exists
      changed_when: true
  roles:
    - role: podman
    - role: litellm
