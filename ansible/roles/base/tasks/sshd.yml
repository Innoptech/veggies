---
- name: Ensure ssh host keys exist (no-op when present; fresh images lack them)
  ansible.builtin.command:
    cmd: /usr/bin/ssh-keygen -A
  register: base_ssh_hostkeys
  changed_when: base_ssh_hostkeys.stdout | length > 0

- name: Install hardened sshd drop-in
  ansible.builtin.template:
    src: sshd_infra.conf.j2
    dest: /etc/ssh/sshd_config.d/50-infra.conf
    owner: root
    group: root
    mode: "0640"
    validate: /usr/sbin/sshd -t -f %s # broken config can never take sshd down
  notify: Restart sshd

- name: Ensure sshd is enabled and running
  ansible.builtin.service:
    name: sshd
    enabled: true
    state: started
