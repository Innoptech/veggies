---
- name: Verify
  hosts: instance
  become: true
  gather_facts: false
  tasks:
    - name: Quadlet installed
      ansible.builtin.slurp:
        src: /home/fedora/.config/containers/systemd/opencode.container
      register: opencode_quadlet_content

    - name: Quadlet content is as designed
      ansible.builtin.assert:
        that:
          - "'PublishPort=127.0.0.1:4096:4096' in (opencode_quadlet_content.content | b64decode)"
          - "'SUPERPOWERS_DISABLE_TELEMETRY=1' in (opencode_quadlet_content.content | b64decode)"
          - "'NoNewPrivileges=true' in (opencode_quadlet_content.content | b64decode)"

    - name: Helper scripts installed and executable
      ansible.builtin.stat:
        path: "/usr/local/bin/{{ item }}"
      register: opencode_helpers
      loop: [agent-attach, agent-status]

    - name: Assert helper scripts
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.mode == "0755"
        fail_msg: "helper {{ item.item }} missing or not 0755"
      loop: "{{ opencode_helpers.results }}"

    - name: Config and data directories exist
      ansible.builtin.stat:
        path: "/home/fedora/{{ item }}"
      register: opencode_dirs
      loop:
        - .config/opencode
        - .local/share/opencode
        - src

    - name: Assert directories
      ansible.builtin.assert:
        that: item.stat.isdir
        fail_msg: "missing directory {{ item.item }}"
      loop: "{{ opencode_dirs.results }}"

    - name: Resolve the user's uid
      ansible.builtin.getent:
        database: passwd
        key: fedora

    - name: Quadlet generator accepts the unit
      ansible.builtin.command:
        cmd: /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun
      register: opencode_dryrun
      changed_when: false
      become: true
      become_user: fedora
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts.getent_passwd['fedora'][2] }}"
      failed_when: false

    - name: Generator produced the opencode service
      ansible.builtin.assert:
        that: "'opencode.service' in (opencode_dryrun.stdout + opencode_dryrun.stderr)"
        fail_msg: "quadlet generator did not emit opencode.service"
