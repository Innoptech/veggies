---
opencode_user: "{{ admin_user }}"
# Verified 2026-09-03 as the latest release. NOTE: opencode does not publish
# release checksums - pinned by version only (accepted risk; revisit if
# upstream starts publishing digests). TODO(verify) each bump.
opencode_version: "1.18.27"
opencode_port: 4096
opencode_image: "localhost/opencode:{{ opencode_version }}"

# Test/container gates:
opencode_build_image: true # false in molecule
opencode_start: true # false in molecule
opencode_sync_config: true # false in molecule (playbook-relative agent-config path)

# Source of the synced global config. Default: the vendored agent-config/ tree
# at the repo root (ADR 0012).
opencode_config_src: "{{ playbook_dir }}/../../agent-config"
