---
all:
  children:
    agents:
      hosts:
        veggies:
          # Connection is resolved through ~/.ssh/config ("Host veggies"):
          # the public IP during bootstrap, the MagicDNS name after the
          # tailscale role runs. The IP is intentionally NOT committed to git.
          ansible_user: fedora
          ansible_python_interpreter: /usr/bin/python3
